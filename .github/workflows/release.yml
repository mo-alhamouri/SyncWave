name: Release

# Push a tag like v1.2.8 to build macOS (Intel + Apple Silicon) and Windows
# installers and publish them as a GitHub Release. The in-app updater and the
# website both read from the latest release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Package app (macOS, Intel + Apple Silicon)
        if: runner.os == 'macOS'
        run: bash scripts/ci-build-mac.sh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package app (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist_electron/*.dmg
            dist_electron/*.zip
            dist_electron/*.exe
            dist_electron/*.blockmap
            dist_electron/latest*.yml

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          make_latest: 'true'
          generate_release_notes: true
          files: dist/*
