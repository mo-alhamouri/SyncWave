name: Deploy Marketing Website

# Publishes the "Marketing Website" folder to the gh-pages branch, which
# serves https://mo-alhamouri.github.io/SyncWave/
on:
  push:
    branches: [main]
    paths:
      - 'Marketing Website/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./Marketing Website
          commit_message: 'Deploy website'
